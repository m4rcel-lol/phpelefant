[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phpelefant"
version = "0.1.0"
description = "PHPelefant Telegram community management bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.22,<4.0",
  "alembic>=1.13,<2.0",
  "asyncpg>=0.29,<1.0",
  "aiosqlite>=0.19,<1.0",
  "pydantic-settings>=2.2,<3.0",
  "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["phpelefant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

