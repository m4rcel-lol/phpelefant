services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: phpelefant
      POSTGRES_USER: phpelefant
      POSTGRES_PASSWORD: phpelefant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phpelefant -d phpelefant"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://phpelefant:phpelefant@postgres:5432/phpelefant
      SHELL_RUNTIME_USER: phpelefant-env
      SHELL_ENFORCE_RUNTIME_USER: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
