[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phpelefant-discord"
version = "0.1.0"
description = "PHPelefant Discord community management bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4.0",
  "aiosqlite>=0.19,<1.0",
  "asyncpg>=0.29,<1.0",
  "davey>=0.1.5,<0.2.0",
  "discord.py[voice]>=2.5,<3.0",
  "Pillow>=10.0,<12.0",
  "PyNaCl>=1.5,<2.0",
  "pydantic-settings>=2.2,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "yt-dlp>=2025.12.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.23,<1.0", "ruff>=0.6,<1.0"]

[tool.setuptools.packages.find]
include = ["phpelefant_discord*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
